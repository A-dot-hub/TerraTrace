<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="logoGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g stroke="url(#logoGreenGrad)" stroke-width="4.2" filter="url(#neonGlow)">
    <!-- Central Main Leaf Outline -->
    <path d="M 50 62 C 34 50 32 30 50 12 C 68 30 66 50 50 62 Z" />
    
    <!-- Central Leaf Midrib (Vein) -->
    <path d="M 50 62 L 50 16" />
    
    <!-- Central Leaf Side Veins (Left) -->
    <path d="M 50 48 C 42 45 39 40 37 36" />
    <path d="M 50 38 C 43 35 41 30 40 25" />
    <path d="M 50 28 C 46 25 45 22 44 19" />
    
    <!-- Central Leaf Side Veins (Right) -->
    <path d="M 50 48 C 58 45 61 40 63 36" />
    <path d="M 50 38 C 57 35 59 30 60 25" />
    <path d="M 50 28 C 54 25 55 22 56 19" />

    <!-- Left Leaf Outline -->
    <path d="M 44 68 C 30 67 18 56 18 42 C 18 32 26 26 36 30 C 42 34 46 45 44 68 Z" />
    <!-- Left Leaf Midrib & Vein -->
    <path d="M 43 64 C 33 55 27 46 22 36" />
    <path d="M 33 52 C 27 52 23 48 20 44" />
    <path d="M 37 45 C 32 42 29 37 27 33" />

    <!-- Right Curved Stem / Branch -->
    <path d="M 56 70 C 66 65 77 56 76 40 C 75 29 67 25 60 30" />
    <!-- Right Leaf Midrib & Vein -->
    <path d="M 57 66 C 65 58 69 48 70 38" />
    <path d="M 64 54 C 70 51 73 45 74 38" />

    <!-- Delicate shoot extending to top-right bud -->
    <path d="M 66 33 C 74 27 77 22 79 16" />
    <!-- Sprout / Bud Node (Circle) -->
    <circle cx="80.5" cy="15.5" r="3.2" fill="#34D399" stroke="url(#logoGreenGrad)" stroke-width="2.5" />

    <!-- Root / Trunk Base: Triple Parallel Stems -->
    <!-- Center stem -->
    <path d="M 50 62 L 50 88" />
    <!-- Left stem curving inward -->
    <path d="M 42 66 C 42 74 43 82 43 88" />
    <!-- Right stem curving inward -->
    <path d="M 58 66 C 58 74 57 82 57 88" />
  </g>
</svg>
